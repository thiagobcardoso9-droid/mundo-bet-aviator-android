name: Gerar APK MUNDO BET AVIATOR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Conferir ícone oficial
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/res/drawable/ic_launcher_official.webp
          grep -q 'android:icon="@drawable/ic_launcher_official"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@drawable/ic_launcher_official"' app/src/main/AndroidManifest.xml
          file app/src/main/res/drawable/ic_launcher_official.webp
          echo 'Ícone oficial encontrado e Manifest configurado.'

      - name: Conferir identificação do APK
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MUNDO-BET-AVIATOR-APK/1.0.8' app/src/main/java/com/rt/mundobetaviator/MainActivity.java
          grep -q "versionName '1.0.8'" app/build.gradle
          echo 'Identificação APK 1.0.8 configurada.'

      - name: Gerar APK
        run: gradle clean assembleDebug

      - name: Conferir ícone dentro do APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -Z1 "$APK" | grep 'ic_launcher_official' >/tmp/icon_entries.txt
          cat /tmp/icon_entries.txt
          test -s /tmp/icon_entries.txt

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MUNDO-BET-AVIATOR-1.0.8.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MUNDO-BET-AVIATOR-1.0.8
          path: MUNDO-BET-AVIATOR-1.0.8.apk
          if-no-files-found: error
          retention-days: 30
