name: Gerar APK MUNDO BET AVIATOR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Conferir recursos do launcher
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -s app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' app/src/main/AndroidManifest.xml
          echo 'Recursos do launcher encontrados.'

      - name: Gerar APK
        run: gradle clean assembleDebug

      - name: Conferir ícone dentro do APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -Z1 "$APK" | grep -E 'res/mipmap-(mdpi|hdpi|xhdpi|xxhdpi|xxxhdpi)-v4/ic_launcher\.png' >/tmp/icon_entries.txt
          cat /tmp/icon_entries.txt
          test -s /tmp/icon_entries.txt

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MUNDO-BET-AVIATOR-1.0.6.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MUNDO-BET-AVIATOR-1.0.6
          path: MUNDO-BET-AVIATOR-1.0.6.apk
          if-no-files-found: error
          retention-days: 30
