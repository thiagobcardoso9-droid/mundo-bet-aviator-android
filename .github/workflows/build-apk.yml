name: Gerar APK MUNDO BET AVIATOR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validar PNGs reais do launcher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct
          files = [
              Path('app/src/main/res/mipmap-mdpi/ic_launcher.png'),
              Path('app/src/main/res/mipmap-hdpi/ic_launcher.png'),
              Path('app/src/main/res/mipmap-xhdpi/ic_launcher.png'),
              Path('app/src/main/res/mipmap-xxhdpi/ic_launcher.png'),
              Path('app/src/main/res/mipmap-xxxhdpi/ic_launcher.png'),
              Path('app/src/main/res/mipmap-mdpi/ic_launcher_round.png'),
              Path('app/src/main/res/mipmap-hdpi/ic_launcher_round.png'),
              Path('app/src/main/res/mipmap-xhdpi/ic_launcher_round.png'),
              Path('app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png'),
              Path('app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png'),
              Path('app/src/main/res/drawable-nodpi/ic_launcher_foreground.png'),
          ]
          for f in files:
              data = f.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'PNG inválido: {f}'
              w, h = struct.unpack('>II', data[16:24])
              assert w > 0 and h > 0, f'Dimensões inválidas: {f}'
              print(f'PNG OK: {f} - {w}x{h} - {len(data)} bytes')
          for f in [
              Path('app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml'),
              Path('app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml')
          ]:
              assert f.exists(), f'Adaptive icon ausente: {f}'
              print(f'ADAPTIVE OK: {f}')
          PY

      - name: Gerar APK
        run: gradle clean assembleDebug

      - name: Validar ícone dentro do APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -E 'res/mipmap-(mdpi|hdpi|xhdpi|xxhdpi|xxxhdpi)-v4/ic_launcher(_round)?\.png'
          unzip -l "$APK" | grep -E 'res/mipmap-anydpi-v26/ic_launcher(_round)?\.xml'
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.png > /tmp/ic_launcher.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          data=Path('/tmp/ic_launcher.png').read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'Ícone PNG final inválido'
          w,h=struct.unpack('>II',data[16:24])
          print(f'ÍCONE FINAL OK: {w}x{h} - {len(data)} bytes')
          PY

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MUNDO-BET-AVIATOR.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MUNDO-BET-AVIATOR-APK
          path: MUNDO-BET-AVIATOR.apk
          retention-days: 30
