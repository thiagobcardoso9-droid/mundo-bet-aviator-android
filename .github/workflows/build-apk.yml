name: Gerar APK MUNDO BET AVIATOR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validar logo WebP antes da compilação
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for f in [Path('app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp'), Path('app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.webp')]:
              data = f.read_bytes()
              assert len(data) > 2000, f'Arquivo incompleto: {f}'
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', f'WebP inválido: {f}'
              print(f'LOGO WEBP VÁLIDA: {f} - {len(data)} bytes')
          for f in [Path('app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml'), Path('app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml')]:
              assert f.exists(), f'Adaptive icon ausente: {f}'
              print(f'ADAPTIVE ICON OK: {f}')
          PY

      - name: Gerar APK
        run: gradle clean assembleDebug

      - name: Validar ícone dentro do APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -E 'res/mipmap-xxxhdpi-v4/ic_launcher(_round)?\.webp'
          unzip -l "$APK" | grep -E 'res/mipmap-anydpi-v26/ic_launcher(_round)?\.xml|res/mipmap-anydpi-v26-v26/ic_launcher(_round)?\.xml' || true
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/ic_launcher.webp
          python3 - <<'PY'
          from pathlib import Path
          data = Path('/tmp/ic_launcher.webp').read_bytes()
          assert len(data) > 2000, 'Ícone dentro do APK incompleto'
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', 'Ícone WebP dentro do APK inválido'
          print(f'ÍCONE FINAL WEBP VÁLIDO: {len(data)} bytes')
          PY

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MUNDO-BET-AVIATOR.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MUNDO-BET-AVIATOR-APK
          path: MUNDO-BET-AVIATOR.apk
          retention-days: 30
