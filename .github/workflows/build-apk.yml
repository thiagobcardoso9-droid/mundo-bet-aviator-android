name: Gerar APK MUNDO BET AVIATOR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar logo PNG oficial
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/mipmap app/src/main/res/drawable-nodpi
          rm -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.* app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.*
          rm -f app/src/main/res/drawable/ic_launcher_foreground.xml
          cat > /tmp/logo.b64 <<'B64'
          
          B64
          tr -d '[:space:]' < /tmp/logo.b64 | base64 -d > /tmp/ic_launcher.png
          file /tmp/ic_launcher.png
          file /tmp/ic_launcher.png | grep -q 'PNG image data, 48 x 48'
          cp /tmp/ic_launcher.png app/src/main/res/mipmap/ic_launcher.png
          cp /tmp/ic_launcher.png app/src/main/res/mipmap/ic_launcher_round.png
          cp /tmp/ic_launcher.png app/src/main/res/drawable-nodpi/ic_launcher_foreground.png

      - name: Validar recursos do launcher
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/res/mipmap/ic_launcher.png
          test -s app/src/main/res/mipmap/ic_launcher_round.png
          test -s app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          file app/src/main/res/mipmap/ic_launcher.png | grep -q 'PNG image data, 48 x 48'
          echo 'LOGO PNG OFICIAL VÁLIDA'

      - name: Gerar APK
        run: gradle clean assembleDebug

      - name: Validar ícone dentro do APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -E 'ic_launcher|ic_launcher_foreground'
          ENTRY=$(unzip -Z1 "$APK" | grep -E 'res/mipmap[^/]*/ic_launcher\.png$|res/mipmap/ic_launcher\.png$' | head -1)
          test -n "$ENTRY"
          unzip -p "$APK" "$ENTRY" > /tmp/final_icon.png
          file /tmp/final_icon.png | grep -q 'PNG image data, 48 x 48'
          echo 'ÍCONE FINAL PNG VÁLIDO DENTRO DO APK'

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MUNDO-BET-AVIATOR.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MUNDO-BET-AVIATOR-APK
          path: MUNDO-BET-AVIATOR.apk
          retention-days: 30
