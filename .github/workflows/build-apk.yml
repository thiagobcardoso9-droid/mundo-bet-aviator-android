name: Gerar APK MUNDO BET AVIATOR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK
        run: gradle assembleDebug

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MUNDO-BET-AVIATOR.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MUNDO-BET-AVIATOR-APK
          path: MUNDO-BET-AVIATOR.apk
          retention-days: 30
