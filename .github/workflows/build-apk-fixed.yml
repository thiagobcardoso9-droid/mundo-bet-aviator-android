name: Gerar APK FINAL COM LOGO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validar ícones PNG reais
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib

          files = [
              Path('app/src/main/res/mipmap-mdpi/ic_launcher.png'),
              Path('app/src/main/res/mipmap-hdpi/ic_launcher.png'),
              Path('app/src/main/res/mipmap-xhdpi/ic_launcher.png'),
              Path('app/src/main/res/mipmap-xxhdpi/ic_launcher.png'),
              Path('app/src/main/res/mipmap-xxxhdpi/ic_launcher.png'),
              Path('app/src/main/res/drawable-nodpi/ic_launcher_foreground.png'),
          ]

          for f in files:
              d = f.read_bytes()
              assert d.startswith(b'\x89PNG\r\n\x1a\n'), f'PNG inválida: {f}'
              pos = 8
              saw_iend = False
              while pos + 12 <= len(d):
                  n = struct.unpack('>I', d[pos:pos+4])[0]
                  t = d[pos+4:pos+8]
                  p = d[pos+8:pos+8+n]
                  crc = struct.unpack('>I', d[pos+8+n:pos+12+n])[0]
                  assert (zlib.crc32(p, zlib.crc32(t)) & 0xffffffff) == crc, f'CRC inválido: {f}'
                  pos += 12 + n
                  if t == b'IEND':
                      saw_iend = True
                      break
              assert saw_iend, f'PNG incompleta: {f}'
              print(f'OK: {f} ({len(d)} bytes)')
          PY

      - name: Gerar APK
        run: gradle clean assembleDebug

      - name: Validar APK gerado
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -Z1 "$APK" | grep -E 'res/mipmap-.*/ic_launcher\.png|res/mipmap-anydpi-v26/ic_launcher\.xml' >/tmp/icon_entries.txt
          cat /tmp/icon_entries.txt
          test -s /tmp/icon_entries.txt

      - name: Preparar APK final
        run: cp app/build/outputs/apk/debug/app-debug.apk MUNDO-BET-AVIATOR-FINAL.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MUNDO-BET-AVIATOR-FINAL
          path: MUNDO-BET-AVIATOR-FINAL.apk
          if-no-files-found: error
          retention-days: 30
