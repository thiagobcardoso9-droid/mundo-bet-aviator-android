name: Gerar APK FINAL COM LOGO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validar ícone JPG real
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/res/drawable/app_icon.jpg
          file app/src/main/res/drawable/app_icon.jpg
          file app/src/main/res/drawable/app_icon.jpg | grep -Eq 'JPEG image data|JPG image data'

      - name: Gerar APK
        run: gradle clean assembleDebug

      - name: Validar APK gerado
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -Z1 "$APK" | grep -E 'res/drawable/app_icon\.jpg' >/tmp/icon_entries.txt
          cat /tmp/icon_entries.txt
          test -s /tmp/icon_entries.txt

      - name: Preparar APK final
        run: cp app/build/outputs/apk/debug/app-debug.apk MUNDO-BET-AVIATOR-FINAL.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MUNDO-BET-AVIATOR-FINAL
          path: MUNDO-BET-AVIATOR-FINAL.apk
          if-no-files-found: error
          retention-days: 30
